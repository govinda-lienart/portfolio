<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1190" viewBox="0 0 1220 1190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="1190" fill="#fdfdfb"/>
  <text x="610" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">extract_frames.py — flow</text>

  <!-- ===== inputs ===== -->
  <rect x="60" y="65" width="240" height="50" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="13" fill="#4a2c85">.env</text>

  <rect x="880" y="65" width="260" height="50" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="1010" y="95" text-anchor="middle" font-size="13" fill="#4a2c85">config.yaml</text>

  <!-- ===== STEP 1 ===== -->
  <rect x="340" y="150" width="520" height="56" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="174" font-size="13" font-weight="bold" fill="#7a5c00">STEP 1 — READ config</text>
  <text x="360" y="194" font-size="11" fill="#8a6d10">video_path, frames_dir, sample_rate, start / end seconds</text>
  <path d="M 1010 115 C 1010 150 940 172 862 178" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="208" x2="600" y2="234" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 2 ===== -->
  <rect x="340" y="236" width="520" height="56" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="260" font-size="13" font-weight="bold" fill="#7a5c00">STEP 2 — BUILD folder path</text>
  <text x="360" y="280" font-size="11" fill="#8a6d10">frames/frames_{video_name}_{timestamp}</text>

  <rect x="900" y="242" width="260" height="44" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="1030" y="261" text-anchor="middle" font-size="12" fill="#1c3f80">frame_folder_path</text>
  <text x="1030" y="277" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">used in STEP 5 and STEP 7</text>
  <line x1="862" y1="264" x2="898" y2="264" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="294" x2="600" y2="320" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3 ===== -->
  <rect x="60" y="323" width="240" height="54" rx="8" fill="#fff2e6" stroke="#c9701e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="180" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4400">get_connection()</text>
  <text x="180" y="364" text-anchor="middle" font-size="10" fill="#8a5510">imported from scripts/db.py</text>
  <line x1="180" y1="115" x2="180" y2="321" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="302" y1="350" x2="338" y2="350" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="322" width="520" height="56" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="346" font-size="13" font-weight="bold" fill="#7a5c00">STEP 3 — CONNECT to MySQL</text>
  <text x="360" y="366" font-size="11" fill="#8a6d10">conn, cursor</text>
  <line x1="600" y1="380" x2="600" y2="406" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 4: guardrails ===== -->
  <rect x="330" y="408" width="540" height="252" rx="14" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="429" font-size="11.5" font-weight="bold" fill="#a52a1e">STEP 4 — GUARDRAILS</text>

  <circle cx="352" cy="465" r="9" fill="#f6dedb" stroke="#c0392b" stroke-width="1"/>
  <text x="352" y="468.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#a52a1e">1</text>
  <rect x="375" y="440" width="470" height="50" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="392" y="461" font-size="12.5" font-weight="bold" fill="#7a5c00">unique constraint</text>
  <text x="392" y="479" font-size="10.5" fill="#8a6d10">(video_id, frame_number) never stored twice</text>
  <line x1="600" y1="492" x2="600" y2="513" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="352" cy="540" r="9" fill="#f6dedb" stroke="#c0392b" stroke-width="1"/>
  <text x="352" y="543.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#a52a1e">2</text>
  <rect x="375" y="515" width="470" height="50" rx="8" fill="#fff2e6" stroke="#c9701e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="392" y="536" font-size="12.5" font-weight="bold" fill="#7a4400">video registered?</text>
  <text x="392" y="554" font-size="10.5" fill="#8a5510">get_video_id() → video_id, video_fps</text>
  <line x1="600" y1="567" x2="600" y2="588" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="352" cy="615" r="9" fill="#f6dedb" stroke="#c0392b" stroke-width="1"/>
  <text x="352" y="618.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#a52a1e">3</text>
  <rect x="375" y="590" width="470" height="50" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="392" y="611" font-size="12.5" font-weight="bold" fill="#7a5c00">already extracted?</text>
  <text x="392" y="629" font-size="10.5" fill="#8a6d10">COUNT(*) in frames for this video</text>

  <!-- MySQL cylinders -->
  <path d="M 925 518 L 925 562 A 55 10 0 0 0 1035 562 L 1035 518" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <ellipse cx="980" cy="562" rx="55" ry="10" fill="#dff2e6" stroke="#2f9e5c" stroke-width="1.5"/>
  <ellipse cx="980" cy="518" rx="55" ry="10" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="980" y="545" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c6b3f">videos</text>

  <path d="M 1055 452 L 1055 990 A 70 10 0 0 0 1195 990 L 1195 452" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <ellipse cx="1125" cy="990" rx="70" ry="10" fill="#dff2e6" stroke="#2f9e5c" stroke-width="1.5"/>
  <ellipse cx="1125" cy="452" rx="70" ry="10" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="1125" y="720" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c6b3f">frames</text>

  <path d="M 847 465 C 950 465 1000 465 1053 465" fill="none" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 847 540 L 923 540" fill="none" stroke="#7a4400" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 847 615 C 950 615 1000 615 1053 615" fill="none" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== decision ===== -->
  <line x1="600" y1="662" x2="600" y2="688" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="600,690 700,725 600,760 500,725" fill="#fceef7" stroke="#b8368f" stroke-width="1.5"/>
  <text x="600" y="722" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f61">already</text>
  <text x="600" y="736" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f61">done?</text>

  <rect x="60" y="705" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="180" y="730" text-anchor="middle" font-size="11.5" fill="#444">STOP (SystemExit)</text>
  <line x1="500" y1="725" x2="302" y2="725" stroke="#b8368f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="716" text-anchor="middle" font-size="10" fill="#7a1f61">yes</text>

  <line x1="600" y1="760" x2="600" y2="798" stroke="#b8368f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="784" text-anchor="middle" font-size="10" fill="#7a1f61">no</text>

  <!-- ===== STEP 5 ===== -->
  <rect x="340" y="800" width="520" height="90" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="824" font-size="13" font-weight="bold" fill="#7a5c00">STEP 5 — EXTRACT frames to disk</text>
  <text x="360" y="845" font-size="11" fill="#8a6d10">every Nth frame (step = fps / sample_rate) → cap.read() → JPG</text>
  <text x="360" y="863" font-size="11" fill="#8a6d10">all other frames → cap.grab() (skipped, fast)</text>
  <text x="360" y="881" font-size="11" fill="#8a6d10">each kept frame → one tuple in rows</text>

  <rect x="60" y="805" width="240" height="40" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="830" text-anchor="middle" font-size="12" fill="#4a2c85">source video</text>
  <line x1="302" y1="825" x2="338" y2="825" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="850" width="240" height="40" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="875" text-anchor="middle" font-size="12" fill="#4a2c85">JPG frames on disk</text>
  <line x1="338" y1="870" x2="302" y2="870" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="900" y="830" width="140" height="46" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="970" y="858" text-anchor="middle" font-size="12" fill="#1c3f80">rows</text>
  <line x1="862" y1="853" x2="898" y2="853" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="600" y1="892" x2="600" y2="928" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 6 ===== -->
  <rect x="340" y="930" width="520" height="60" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="954" font-size="13" font-weight="bold" fill="#7a5c00">STEP 6 — REGISTER in MySQL</text>
  <text x="360" y="975" font-size="11" fill="#8a6d10">executemany(INSERT IGNORE, rows) + commit</text>

  <path d="M 970 876 C 970 915 930 942 864 948" fill="none" stroke="#3b6fd1" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#arrow)" opacity="0.75"/>
  <path d="M 862 975 C 950 975 1000 975 1053 975" fill="none" stroke="#7a4400" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="992" x2="600" y2="1028" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 7 ===== -->
  <rect x="340" y="1030" width="520" height="60" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="1054" font-size="13" font-weight="bold" fill="#7a5c00">STEP 7 — SIDECAR + DONE</text>
  <text x="360" y="1075" font-size="11" fill="#8a6d10">write extraction_params.yaml, close connection</text>

  <rect x="900" y="1030" width="290" height="62" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="1045" y="1052" text-anchor="middle" font-size="12" fill="#4a2c85">extraction_params.yaml</text>
  <text x="1045" y="1068" text-anchor="middle" font-size="9.5" fill="#6b4a9e">read later by store_annotations.py → annotation_sets</text>
  <text x="1045" y="1082" text-anchor="middle" font-size="9.5" fill="#6b4a9e">→ dataset_card → MLflow lineage</text>
  <line x1="862" y1="1060" x2="898" y2="1060" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="60" y="1140" width="20" height="14" rx="3" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="86" y="1151" font-size="10.5" fill="#555">external file</text>
  <rect x="230" y="1140" width="20" height="14" rx="3" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="256" y="1151" font-size="10.5" fill="#555">value in memory</text>
  <rect x="420" y="1140" width="20" height="14" rx="3" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="446" y="1151" font-size="10.5" fill="#555">step in this script</text>
  <rect x="640" y="1140" width="20" height="14" rx="3" fill="#fff2e6" stroke="#c9701e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="666" y="1151" font-size="10.5" fill="#555">imported from scripts.db</text>
  <polygon points="890,1140 910,1147 890,1154 870,1147" fill="#fceef7" stroke="#b8368f" stroke-width="1.5"/>
  <text x="920" y="1151" font-size="10.5" fill="#555">branch</text>
  <path d="M 1010 1147 L 1040 1147" stroke="#2f9e5c" stroke-width="3"/>
  <text x="1050" y="1151" font-size="10.5" fill="#555">MySQL table</text>
</svg>
