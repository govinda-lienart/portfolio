<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1020" fill="#fdfdfb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">sync_videos.py — flow</text>

  <!-- ===== pre-loop: runs ONCE, before iterating ===== -->
  <text x="60" y="62" font-size="11" fill="#999" font-style="italic">— runs once, before the loop —</text>

  <!-- xlsx — external file on disk, same category as "video file on disk" below -->
  <rect x="60" y="72" width="230" height="60" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="175" y="97" text-anchor="middle" font-size="13" fill="#4a2c85">video_metadata.xlsx</text>
  <text x="175" y="115" text-anchor="middle" font-size="11" fill="#6b4a9e">activity, plants, fish_count, notes, ...</text>

  <!-- .env — external file on disk -->
  <rect x="710" y="72" width="230" height="60" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="825" y="97" text-anchor="middle" font-size="13" fill="#4a2c85">.env</text>
  <text x="825" y="115" text-anchor="middle" font-size="11" fill="#6b4a9e">DB_HOST / PORT / USER / ...</text>

  <!-- load_video_row -->
  <rect x="60" y="172" width="230" height="70" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="175" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c00">load_video_row(xlsx_path)</text>
  <text x="175" y="218" text-anchor="middle" font-size="11" fill="#8a6d10">openpyxl → list of dicts</text>

  <!-- connect (imported) -->
  <rect x="710" y="172" width="230" height="70" rx="8" fill="#fff2e6" stroke="#c9701e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="825" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4400">get_connection()</text>
  <text x="825" y="212" text-anchor="middle" font-size="10.5" fill="#8a5510">imported from scripts/db.py</text>
  <text x="825" y="226" text-anchor="middle" font-size="10.5" fill="#8a5510">(not written in this file)</text>

  <!-- video_rows -->
  <rect x="60" y="282" width="230" height="50" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="175" y="312" text-anchor="middle" font-size="13" fill="#1c3f80">video_rows (list[dict])</text>

  <!-- conn -->
  <rect x="710" y="282" width="230" height="50" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="825" y="312" text-anchor="middle" font-size="13" fill="#1c3f80">conn (MySQL connection)</text>

  <!-- ===== the loop (own row, nothing shares its y-range) — magenta, distinct from purple/green ===== -->
  <rect x="350" y="390" width="300" height="60" rx="30" fill="#fceef7" stroke="#b8368f" stroke-width="1.5"/>
  <text x="500" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1f61">for row in video_rows:</text>
  <text x="500" y="468" text-anchor="middle" font-size="11" fill="#888" font-style="italic">everything below runs once PER row</text>

  <!-- video file on disk — its own row, below the loop, no x/y overlap with it -->
  <rect x="700" y="490" width="240" height="60" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="820" y="515" text-anchor="middle" font-size="13" fill="#4a2c85">video file on disk</text>
  <text x="820" y="533" text-anchor="middle" font-size="10.5" fill="#6b4a9e">the actual .MOV/.mp4, row["file_path"]</text>

  <!-- register_video box — defined in this file, same yellow as the other two functions -->
  <rect x="60" y="580" width="480" height="220" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="300" y="606" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">register_video(row, conn)</text>

  <text x="300" y="636" text-anchor="middle" font-size="12" fill="#7a5c00">1. calls get_video_fps_resolution(row["file_path"]) →</text>

  <line x1="90" y1="650" x2="510" y2="650" stroke="#c99a1e" stroke-width="1"/>

  <text x="300" y="672" text-anchor="middle" font-size="12" fill="#7a5c00">2. cursor.execute(INSERT ... ON DUPLICATE KEY UPDATE)</text>
  <text x="300" y="690" text-anchor="middle" font-size="10.5" fill="#8a6d10">13 columns: file_path, fps, resolution, activity,</text>
  <text x="300" y="704" text-anchor="middle" font-size="10.5" fill="#8a6d10">plants, fish_count, notes, filmed_at, species, morph,</text>
  <text x="300" y="718" text-anchor="middle" font-size="10.5" fill="#8a6d10">tank_width_cm, tank_height_cm, tank_depth_cm</text>
  <text x="300" y="736" text-anchor="middle" font-size="10.5" fill="#8a6d10">→ fps/resolution from step 1; everything else from row (xlsx)</text>

  <text x="300" y="762" text-anchor="middle" font-size="12" fill="#7a5c00">3. conn.commit() → cursor.close() → logger.info(...)</text>

  <!-- get_video_fps_resolution — called by register_video, own row below video-file box -->
  <rect x="700" y="580" width="240" height="100" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="820" y="604" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c00">get_video_fps_resolution</text>
  <text x="820" y="620" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c00">(file_path)</text>
  <text x="820" y="642" text-anchor="middle" font-size="10.5" fill="#8a6d10">cv2.VideoCapture(file_path)</text>
  <text x="820" y="658" text-anchor="middle" font-size="10.5" fill="#8a6d10">→ reads real fps, width</text>
  <text x="820" y="672" text-anchor="middle" font-size="10.5" fill="#8a6d10">from the file itself</text>

  <!-- call arrow: register_video calls get_video_fps_resolution -->
  <path d="M 540 630 C 610 630 640 630 698 630" fill="none" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="619" y="620" text-anchor="middle" font-size="9.5" fill="#7a5c00">calls</text>

  <!-- return arrow: get_video_fps_resolution returns fps, resolution back into register_video -->
  <path d="M 698 655 C 640 655 610 655 540 655" fill="none" stroke="#c99a1e" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
  <text x="619" y="670" text-anchor="middle" font-size="9.5" fill="#8a6d10">returns fps, resolution</text>

  <!-- video file -> get_video_fps_resolution -->
  <line x1="820" y1="550" x2="820" y2="578" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MySQL videos table — classic database cylinder icon -->
  <path d="M 700 814 L 700 936 A 120 14 0 0 0 940 936 L 940 814" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <ellipse cx="820" cy="936" rx="120" ry="14" fill="#dff2e6" stroke="#2f9e5c" stroke-width="1.5"/>
  <ellipse cx="820" cy="814" rx="120" ry="14" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>

  <text x="820" y="840" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c6b3f">MySQL</text>
  <text x="820" y="856" text-anchor="middle" font-size="12" fill="#1c6b3f">videos table</text>
  <text x="820" y="874" text-anchor="middle" font-size="10" fill="#3c8a5f">UNIQUE(file_path)</text>
  <text x="820" y="888" text-anchor="middle" font-size="10" fill="#3c8a5f">insert new row, or</text>
  <text x="820" y="900" text-anchor="middle" font-size="10" fill="#3c8a5f">update existing one</text>
  <text x="820" y="914" text-anchor="middle" font-size="10" fill="#3c8a5f">→ safe to re-run script</text>

  <!-- register_video -> MySQL -->
  <path d="M 300 800 C 300 850 500 875 698 875" fill="none" stroke="#7a5c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="862" text-anchor="middle" font-size="10" fill="#7a5c00">writes to</text>

  <!-- loop back arrow -->
  <path d="M 60 690 C 10 690 10 415 348 415" fill="none" stroke="#b8368f" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="24" y="550" text-anchor="middle" font-size="10" fill="#7a1f61" transform="rotate(-90 24 550)">next row</text>

  <!-- conn.close() -->
  <rect x="30" y="840" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="135" y="870" text-anchor="middle" font-size="13" fill="#1c3f80">conn.close()</text>

  <!-- register_video -> conn.close() -->
  <path d="M 220 800 C 190 815 160 825 135 838" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="2 2"/>
  <text x="260" y="822" font-size="10" fill="#777">(loop ends)</text>

  <!-- legend — placed below the MySQL cylinder (which extends to y=950) so nothing overlaps -->
  <rect x="60" y="978" width="20" height="14" rx="3" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="86" y="989" font-size="10.5" fill="#555">external file on disk</text>
  <rect x="230" y="978" width="20" height="14" rx="3" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="256" y="989" font-size="10.5" fill="#555">Python value in memory</text>
  <rect x="440" y="978" width="20" height="14" rx="3" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="466" y="989" font-size="10.5" fill="#555">function defined in this file</text>
  <rect x="670" y="978" width="20" height="14" rx="3" fill="#fff2e6" stroke="#c9701e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="696" y="989" font-size="10.5" fill="#555">imported (from scripts.db)</text>

  <!-- ===== arrows: pre-loop inputs -> functions -> outputs ===== -->
  <line x1="175" y1="132" x2="175" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="175" y1="242" x2="175" y2="280" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="825" y1="132" x2="825" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="825" y1="242" x2="825" y2="280" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- outputs -> loop -->
  <path d="M 200 332 C 260 360 330 375 390 388" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 800 332 C 740 360 670 375 610 388" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- loop -> register_video -->
  <line x1="450" y1="450" x2="330" y2="578" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
