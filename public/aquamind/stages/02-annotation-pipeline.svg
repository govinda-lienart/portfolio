<svg width="100%" viewBox="0 0 780 964" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Stage 2 — hand-labelling, YOLO export and relational annotation storage pipeline</title>
  <desc>The frame-indexed dataset from Stage 1 (JPG frames on disk plus rows in the MySQL frames table) is uploaded by upload_labelstudio.py into a new Label Studio project, running in Docker, where every visible fish is boxed by hand. download_labelstudio.py exports the labelled project in YOLO format, producing one text file per frame with one line per bounding box (class, x centre, y centre, width, height, normalised between 0 and 1). store_annotations.py parses each label file, looks up the matching frame_id in the frames table, reads the sidecar files (extraction_params.yaml and download_params.yaml) for provenance, and writes two kinds of rows to MySQL: one row per labelling batch in annotation_sets, and one row per bounding box in annotations, foreign-keyed to both its frame and its batch. Both outputs converge into a labelled dataset in which every box is traceable to its frame and its labelling batch, feeding forward into Stage 3's YOLO training.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .d-title { font-size: 15px; font-weight: 700; fill: #111; }
      .d-sub { font-size: 11px; fill: #666; }
      .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .desc { font-size: 11px; fill: #4a4a4a; }
      .prov { font-size: 9.5px; font-weight: 700; fill: #5b7aa8; letter-spacing: 0.5px; }
      .prov-h { font-size: 9.5px; font-weight: 700; fill: #b5651d; letter-spacing: 0.5px; }
      .res { font-size: 12px; font-weight: 700; fill: #2f5a8a; }
      .note { font-size: 10.5px; font-style: italic; fill: #2f5a8a; }
      .tiny { font-size: 9px; fill: #9a9a9a; }
      .legend { font-size: 10px; fill: #555; text-anchor: start; }
      .box { stroke-width: 1.5; }
      .cyl { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="964" fill="#ffffff"/>

  <text class="d-title" x="390" y="26">Stage 2 — Annotation &amp; Relational Label Storage</text>
  <text class="d-sub" x="390" y="44">Label Studio (Docker) · YOLO export · MySQL 8.4 · 366 boxes / 61 frames</text>

  <!-- input: frames from Stage 1 -->
  <rect class="box" x="50" y="60" width="680" height="72" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-dasharray="4 3"/>
  <text class="prov" x="390" y="80">FROM STAGE 1</text>
  <text class="name" x="390" y="100">Frame-indexed dataset</text>
  <text class="desc" x="390" y="118">JPG frames on disk + rows in the MySQL frames table</text>

  <!-- upload_labelstudio.py -->
  <rect class="box" x="210" y="158" width="360" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="182">upload_labelstudio.py</text>
  <text class="desc" x="390" y="200">creates the project, imports the frames as tasks</text>
  <g fill="none" stroke="#555" stroke-width="1.5">
    <polyline points="390,132 390,156" marker-end="url(#arrow2)"/>
    <polyline points="390,218 390,244" marker-end="url(#arrow2)"/>
  </g>

  <g transform="translate(0 84)">
  <!-- Label Studio: the human step -->
  <rect class="box" x="210" y="162" width="360" height="80" rx="8" fill="#fce5cd" stroke="#e69138"/>
  <text class="prov-h" x="390" y="180">HUMAN STEP</text>
  <text class="name" x="390" y="199">Label Studio (Docker)</text>
  <text class="desc" x="390" y="219">one bounding box drawn by hand</text>
  <text class="desc" x="390" y="233">around every visible fish</text>

  <!-- download_labelstudio.py -->
  <rect class="box" x="210" y="266" width="360" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="290">download_labelstudio.py</text>
  <text class="desc" x="390" y="308">exports the labelled project in YOLO format</text>

  <!-- YOLO label files -->
  <rect class="box" x="210" y="350" width="360" height="64" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text class="name" x="390" y="374">YOLO label files (.txt)</text>
  <text class="desc" x="390" y="393">one file per frame, one line per box:</text>
  <text class="desc" x="390" y="407">class, x centre, y centre, width, height</text>

  <!-- store_annotations.py -->
  <rect class="box" x="210" y="440" width="360" height="76" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="464">store_annotations.py</text>
  <text class="desc" x="390" y="482">parses each label file, finds its frame_id,</text>
  <text class="desc" x="390" y="498">inserts the boxes plus where they came from</text>

  <!-- sidecars (provenance) -->
  <rect class="box" x="604" y="444" width="146" height="68" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text class="name" x="677" y="466">sidecar files</text>
  <text class="desc" x="677" y="484">extraction_params.yaml</text>
  <text class="desc" x="677" y="500">download_params.yaml</text>

  <!-- annotation_sets table (cylinder) -->
  <path class="cyl" d="M 60,568 L 60,634 A 140,14 0 0 0 340,634 L 340,568 A 140,14 0 0 0 60,568 Z" fill="#d0e0e3" stroke="#45818e"/>
  <ellipse class="cyl" cx="200" cy="568" rx="140" ry="14" fill="#d0e0e3" stroke="#45818e"/>
  <text class="name" x="200" y="592">annotation_sets (MySQL)</text>
  <text class="desc" x="200" y="610">one row per labelling batch:</text>
  <text class="desc" x="200" y="626">frame source, sample rate, project id</text>

  <!-- annotations table (cylinder) -->
  <path class="cyl" d="M 440,568 L 440,634 A 150,14 0 0 0 740,634 L 740,568 A 150,14 0 0 0 440,568 Z" fill="#d0e0e3" stroke="#45818e"/>
  <ellipse class="cyl" cx="590" cy="568" rx="150" ry="14" fill="#d0e0e3" stroke="#45818e"/>
  <text class="name" x="590" y="592">annotations (MySQL)</text>
  <text class="desc" x="590" y="610">one row per bounding box: frame_id (FK),</text>
  <text class="desc" x="590" y="626">annotation_set_id (FK), class, x, y, w, h</text>

  <!-- FK link between the two tables -->
  <polyline points="438,600 342,600" fill="none" stroke="#45818e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <text class="tiny" x="390" y="594">FK</text>

  <!-- converged result -->
  <rect class="box" x="190" y="706" width="400" height="86" rx="8" fill="#dbe9f6" stroke="#5b7aa8"/>
  <text class="res" x="390" y="731">Labelled dataset</text>
  <text class="desc" x="390" y="751">every box traceable to its frame and its labelling batch</text>
  <text class="note" x="390" y="776">→ Stage 3: YOLO training</text>

  <!-- edges -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <polyline points="390,242 390,264" marker-end="url(#arrow2)"/>
    <polyline points="390,326 390,348" marker-end="url(#arrow2)"/>
    <polyline points="390,414 390,438" marker-end="url(#arrow2)"/>
    <polyline points="602,478 572,478" marker-end="url(#arrow2)"/>
    <polyline points="390,516 390,540 200,540 200,564" marker-end="url(#arrow2)"/>
    <polyline points="390,516 390,540 590,540 590,564" marker-end="url(#arrow2)"/>
    <polyline points="200,650 200,678 390,678 390,704" marker-end="url(#arrow2)"/>
    <polyline points="590,650 590,678 390,678 390,704" marker-end="url(#arrow2)"/>
  </g>

  <!-- downstream marker -->
  <polyline points="390,792 390,826" fill="none" stroke="#5b7aa8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text class="tiny" x="440" y="818">to Stage 3</text>

  </g>

  <!-- legend -->
  <g>
    <rect x="30" y="936" width="11" height="11" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-dasharray="3 2"/>
    <text class="legend" x="47" y="945">from Stage 1</text>
    <rect x="135" y="936" width="11" height="11" rx="2" fill="#d5e8d4" stroke="#82b366"/>
    <text class="legend" x="152" y="945">script step</text>
    <rect x="235" y="936" width="11" height="11" rx="2" fill="#fce5cd" stroke="#e69138"/>
    <text class="legend" x="252" y="945">human step</text>
    <rect x="335" y="936" width="11" height="11" rx="2" fill="#fff2cc" stroke="#d6b656"/>
    <text class="legend" x="352" y="945">disk file</text>
    <rect x="425" y="936" width="11" height="11" rx="2" fill="#d0e0e3" stroke="#45818e"/>
    <text class="legend" x="442" y="945">MySQL table</text>
    <rect x="535" y="936" width="11" height="11" rx="2" fill="#dbe9f6" stroke="#5b7aa8"/>
    <text class="legend" x="552" y="945">result → downstream</text>
  </g>
</svg>
