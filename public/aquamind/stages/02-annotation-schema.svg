<svg width="100%" viewBox="0 0 1020 790" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Stages 1 and 2 — full entity-relationship diagram of the four MySQL tables</title>
  <desc>Entity-relationship diagram of all four MySQL tables in the aquamind database. Stage 1 creates videos (one row per registered video; id primary key, file_path unique and not null, fps, resolution, activity, plants, fish_count, notes, filmed_at, species, morph and three tank-dimension columns) and frames (one row per extracted frame; id primary key, video_id foreign key to videos.id, frame_path, frame_number, timestamp, extracted_at, unique on video_id and frame_number). Stage 2 adds annotation_sets (one row per labelling batch; id primary key, video_id foreign key to videos.id, frame_source, notes, created_at, frames_extracted, iou_threshold, dedup_window, sample_rate, start_seconds, end_seconds, and the Label Studio project name, id, download time and task-id range) and annotations (one row per bounding box; id primary key, frame_id foreign key to frames.id, annotation_set_id foreign key to annotation_sets.id, class_id, label, x_center, y_center, width, height, created_at). Crow's-foot lines mark four one-to-many relationships: one video has many frames, one video has many annotation sets, one frame has many annotations, and one annotation set has many annotations.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .d-title { font-size: 15px; font-weight: 700; fill: #111; text-anchor: middle; }
      .d-sub { font-size: 11px; fill: #666; text-anchor: middle; }
      .theader { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .col { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1a1a1a; text-anchor: start; }
      .type { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #666; text-anchor: end; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .foot { font-size: 9.5px; fill: #666; text-anchor: middle; }
      .rel { font-size: 10px; fill: #555; text-anchor: middle; }
      .legend { font-size: 10px; fill: #555; text-anchor: start; }
    </style>
  </defs>

