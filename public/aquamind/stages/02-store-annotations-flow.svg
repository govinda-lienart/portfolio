<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="720" fill="#fdfdfb"/>
  <text x="610" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">store_annotations.py — flow</text>

  <!-- ===== inputs ===== -->
  <rect x="60" y="65" width="240" height="50" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="13" fill="#4a2c85">.env</text>

  <rect x="880" y="65" width="260" height="50" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="1010" y="95" text-anchor="middle" font-size="13" fill="#4a2c85">config.yaml</text>

  <!-- ===== STEP 1: read config.yaml + connect ===== -->
  <rect x="340" y="150" width="520" height="84" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="174" font-size="13" font-weight="bold" fill="#7a5c00">STEP 1 — READ config.yaml + CONNECT</text>
  <text x="360" y="196" font-size="11" fill="#8a6d10">read config.yaml → which labels, frames and video to store</text>
  <text x="360" y="214" font-size="11" fill="#8a6d10">connect to MySQL with the .env credentials</text>
  <path d="M 180 115 C 180 150 260 172 338 190" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1010 115 C 1010 150 940 174 862 180" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="234" x2="600" y2="256" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 2: read sidecars ===== -->
  <rect x="340" y="256" width="520" height="70" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="280" font-size="13" font-weight="bold" fill="#7a5c00">STEP 2 — READ SIDECARS</text>
  <text x="360" y="300" font-size="11" fill="#8a6d10">read both sidecars: batch parameters + Label Studio details</text>
  <text x="360" y="316" font-size="11" fill="#8a6d10">a missing file only logs a warning (its values become NULL)</text>
  <line x1="600" y1="326" x2="600" y2="348" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="256" width="240" height="44" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="276" text-anchor="middle" font-size="12" fill="#4a2c85">extraction_params.yaml</text>
  <text x="180" y="291" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">written by the Stage 1 extraction</text>
  <line x1="300" y1="278" x2="338" y2="288" stroke="#8a4fc9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="308" width="240" height="44" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="328" text-anchor="middle" font-size="12" fill="#4a2c85">download_params.yaml</text>
  <text x="180" y="343" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">written by download_labelstudio.py</text>
  <line x1="300" y1="330" x2="338" y2="314" stroke="#8a4fc9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3: create annotation_sets row ===== -->
  <rect x="340" y="348" width="520" height="76" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="372" font-size="13" font-weight="bold" fill="#7a5c00">STEP 3 — CREATE annotation_sets ROW</text>
  <text x="360" y="392" font-size="11" fill="#8a6d10">look up video_id in videos</text>
  <text x="360" y="410" font-size="11" fill="#8a6d10">INSERT one annotation_sets row → annotation_set_id</text>
  <line x1="600" y1="424" x2="600" y2="446" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 4: loop label files, insert annotations ===== -->
  <rect x="340" y="446" width="520" height="94" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="470" font-size="13" font-weight="bold" fill="#7a5c00">STEP 4 — LOOP label files → INSERT annotations</text>
  <text x="360" y="490" font-size="11" fill="#8a6d10">parse the frame number from each label file name</text>
  <text x="360" y="506" font-size="11" fill="#8a6d10">look up frame_id in frames (frame missing → warning, file skipped)</text>
  <text x="360" y="522" font-size="11" fill="#8a6d10">one INSERT into annotations per box, with frame_id + annotation_set_id</text>
  <line x1="600" y1="540" x2="600" y2="562" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="470" width="240" height="44" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="490" text-anchor="middle" font-size="12" fill="#4a2c85">label .txt files</text>
  <text x="180" y="505" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">labels/ folder of the YOLO export</text>
  <line x1="300" y1="492" x2="338" y2="494" stroke="#8a4fc9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 5: commit + done ===== -->
  <rect x="340" y="562" width="520" height="76" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="586" font-size="13" font-weight="bold" fill="#7a5c00">STEP 5 — COMMIT + DONE</text>
  <text x="360" y="606" font-size="11" fill="#8a6d10">one commit saves everything: a run that fails partway saves nothing</text>
  <text x="360" y="622" font-size="11" fill="#8a6d10">prints a summary + a SQL cross-check</text>

  <!-- ===== MySQL (external service, used by STEP 1 / 3 / 4 / 5) ===== -->
  <rect x="1055" y="150" width="150" height="488" rx="12" fill="#eaf6f7" stroke="#1f8fa3" stroke-width="1.5"/>
  <text x="1130" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f5c6b">MySQL</text>
  <text x="1130" y="404" text-anchor="middle" font-size="10.5" fill="#1f8fa3">aquamind database</text>
  <text x="1130" y="428" text-anchor="middle" font-size="10" fill="#1f8fa3">videos</text>
  <text x="1130" y="443" text-anchor="middle" font-size="10" fill="#1f8fa3">frames</text>
  <text x="1130" y="458" text-anchor="middle" font-size="10" fill="#1f8fa3">annotation_sets</text>
  <text x="1130" y="473" text-anchor="middle" font-size="10" fill="#1f8fa3">annotations</text>

  <line x1="862" y1="208" x2="1053" y2="208" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="220" x2="862" y2="220" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="862" y1="380" x2="1053" y2="380" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="392" x2="862" y2="392" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="862" y1="487" x2="1053" y2="487" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="499" x2="862" y2="499" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="862" y1="594" x2="1053" y2="594" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="606" x2="862" y2="606" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="60" y="672" width="20" height="14" rx="3" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="86" y="683" font-size="10.5" fill="#555">external file</text>
  <rect x="230" y="672" width="20" height="14" rx="3" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="256" y="683" font-size="10.5" fill="#555">step in this script</text>
  <line x1="420" y1="679" x2="450" y2="679" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="683" font-size="10.5" fill="#555">SQL request</text>
  <line x1="580" y1="679" x2="610" y2="679" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="620" y="683" font-size="10.5" fill="#555">SQL response</text>
</svg>
