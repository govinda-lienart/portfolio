<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="820" viewBox="0 0 1220 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="820" fill="#fdfdfb"/>
  <text x="610" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">upload_labelstudio.py — flow</text>

  <!-- ===== inputs ===== -->
  <rect x="60" y="65" width="240" height="50" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="13" fill="#4a2c85">.env</text>

  <rect x="880" y="65" width="260" height="50" rx="8" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="1010" y="95" text-anchor="middle" font-size="13" fill="#4a2c85">config.yaml</text>

  <!-- ===== STEP 1: read config.yaml + auth (module load, before main body) ===== -->
  <rect x="340" y="150" width="520" height="110" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="174" font-size="13" font-weight="bold" fill="#7a5c00">STEP 1 — READ config.yaml + AUTH</text>
  <text x="360" y="194" font-size="11" fill="#8a6d10">load .env → LS_URL, LS_TOKEN (raises RuntimeError if missing)</text>
  <text x="360" y="212" font-size="11" fill="#8a6d10">read config.yaml → project_name, frames_dir</text>
  <text x="360" y="230" font-size="11" fill="#8a6d10">POST /api/token/refresh → HEADERS = Bearer &lt;access token&gt;</text>
  <path d="M 180 115 C 180 150 260 172 338 190" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1010 115 C 1010 160 940 200 862 208" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="260" x2="600" y2="282" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 2: list frames ===== -->
  <rect x="340" y="282" width="520" height="56" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="306" font-size="13" font-weight="bold" fill="#7a5c00">STEP 2 — LIST frames</text>
  <text x="360" y="326" font-size="11" fill="#8a6d10">sorted glob(frames_dir/*.jpg) → images</text>
  <line x1="600" y1="338" x2="600" y2="362" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== decision: any images found? ===== -->
  <polygon points="600,362 700,402 600,442 500,402" fill="#fceef7" stroke="#b8368f" stroke-width="1.5"/>
  <text x="600" y="397" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f61">any .jpg</text>
  <text x="600" y="411" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f61">found?</text>

  <rect x="60" y="382" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="180" y="407" text-anchor="middle" font-size="11.5" fill="#444">raise RuntimeError (stop)</text>
  <line x1="500" y1="402" x2="302" y2="402" stroke="#b8368f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="393" text-anchor="middle" font-size="10" fill="#7a1f61">no</text>

  <line x1="600" y1="442" x2="600" y2="468" stroke="#b8368f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="458" text-anchor="middle" font-size="10" fill="#7a1f61">yes</text>

  <!-- images value box, feeds STEP 4 -->
  <rect x="60" y="580" width="240" height="46" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="180" y="603" text-anchor="middle" font-size="12" fill="#1c3f80">images</text>
  <text x="180" y="618" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">the list found in STEP 2</text>
  <path d="M 360 338 C 250 400 180 480 180 578" fill="none" stroke="#3b6fd1" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- ===== STEP 3: create project ===== -->
  <rect x="340" y="468" width="520" height="76" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="492" font-size="13" font-weight="bold" fill="#7a5c00">STEP 3 — CREATE labelstudio project</text>
  <text x="360" y="512" font-size="11" fill="#8a6d10">POST /api/projects with LABEL_CONFIG</text>
  <text x="360" y="530" font-size="11" fill="#8a6d10">predefines danio_rerio + reflection classes → project_id</text>
  <line x1="600" y1="544" x2="600" y2="572" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 4: upload images ===== -->
  <rect x="340" y="572" width="520" height="76" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="596" font-size="13" font-weight="bold" fill="#7a5c00">STEP 4 — UPLOAD images</text>
  <text x="360" y="616" font-size="11" fill="#8a6d10">loop: POST each JPG as a task import</text>
  <text x="360" y="634" font-size="11" fill="#8a6d10">logs i/N after each upload → total uploaded</text>
  <line x1="300" y1="603" x2="338" y2="610" stroke="#3b6fd1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="648" x2="600" y2="676" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 5: done ===== -->
  <rect x="340" y="676" width="520" height="60" rx="8" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="360" y="700" font-size="13" font-weight="bold" fill="#7a5c00">STEP 5 — DONE</text>
  <text x="360" y="720" font-size="11" fill="#8a6d10">prints total imported + the project URL to open</text>

  <!-- result: feeds forward into Label Studio (labelling by hand) -->
  <rect x="900" y="680" width="270" height="54" rx="8" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="1035" y="703" text-anchor="middle" font-size="12" fill="#1c3f80">Label Studio project, N tasks</text>
  <text x="1035" y="719" text-anchor="middle" font-size="9.5" fill="#666" font-style="italic">→ Labelling by hand</text>
  <line x1="862" y1="706" x2="898" y2="706" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Label Studio REST API (external service, reused by STEP 1 / 3 / 4) ===== -->
  <rect x="1055" y="150" width="150" height="498" rx="12" fill="#eaf6f7" stroke="#1f8fa3" stroke-width="1.5"/>
  <text x="1130" y="391" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f5c6b">Label Studio</text>
  <text x="1130" y="409" text-anchor="middle" font-size="10.5" fill="#1f8fa3">(Docker)</text>
  <text x="1130" y="425" text-anchor="middle" font-size="10.5" fill="#1f8fa3">REST API</text>

  <line x1="862" y1="224" x2="1053" y2="224" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="236" x2="862" y2="236" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="862" y1="500" x2="1053" y2="500" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="512" x2="862" y2="512" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="862" y1="604" x2="1053" y2="604" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1053" y1="616" x2="862" y2="616" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="60" y="770" width="20" height="14" rx="3" fill="#f5eefc" stroke="#8a4fc9" stroke-width="1.5"/>
  <text x="86" y="781" font-size="10.5" fill="#555">external file</text>
  <rect x="230" y="770" width="20" height="14" rx="3" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="256" y="781" font-size="10.5" fill="#555">value in memory</text>
  <rect x="420" y="770" width="20" height="14" rx="3" fill="#fff7e0" stroke="#c99a1e" stroke-width="1.5"/>
  <text x="446" y="781" font-size="10.5" fill="#555">step in this script</text>
  <polygon points="660,770 680,777 660,784 640,777" fill="#fceef7" stroke="#b8368f" stroke-width="1.5"/>
  <text x="690" y="781" font-size="10.5" fill="#555">branch</text>
  <line x1="800" y1="777" x2="830" y2="777" stroke="#7a5c00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="781" font-size="10.5" fill="#555">API request</text>
  <line x1="960" y1="777" x2="990" y2="777" stroke="#7a5c00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1000" y="781" font-size="10.5" fill="#555">API response</text>
</svg>
