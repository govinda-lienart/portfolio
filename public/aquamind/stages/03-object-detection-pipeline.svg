<svg width="100%" viewBox="0 0 780 1030" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Stage 3 · Object detection: dataset construction, YOLOv8 fine-tuning and model registration pipeline</title>
  <desc>The labelled dataset from Stage 2 (the annotations, annotation_sets and frames tables in MySQL) is turned into a YOLO dataset folder by prepare_dataset.py, which selects the annotated frames of the chosen annotation sets, splits them 80/20 into train and validation with a fixed random seed, copies the images and writes one YOLO label file per frame. It also writes dataset_card.yaml, recording the annotation sets, video metadata, counts and git commit, and dataset.yaml for YOLO. The dataset is versioned with DVC (pointer file in git, data on Google Drive). A Kaggle GPU notebook clones the repository, pulls the dataset with DVC and fine-tunes a pretrained YOLOv8 model. The run folder (best.pt, last.pt, results.csv and plots) is downloaded by hand. log_artifact_mlflow.py logs the parameters, the per-epoch metrics and the dataset card to MLflow and registers best.pt as a new version of the aquamind-yolo-detector model in the MLflow Model Registry, moving the champion alias to it. Later stages load the detector by alias instead of by file path: the tracker in Stage 4 and the pre-labelling backend in Stage 5.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .d-title { font-size: 15px; font-weight: 700; fill: #111; }
      .d-sub { font-size: 11px; fill: #666; }
      .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .desc { font-size: 11px; fill: #4a4a4a; }
      .prov { font-size: 9.5px; font-weight: 700; fill: #5b7aa8; letter-spacing: 0.5px; }
      .prov-h { font-size: 9.5px; font-weight: 700; fill: #b5651d; letter-spacing: 0.5px; }
      .res { font-size: 12px; font-weight: 700; fill: #2f5a8a; }
      .note { font-size: 10.5px; font-style: italic; fill: #2f5a8a; }
      .tiny { font-size: 9px; fill: #9a9a9a; }
      .legend { font-size: 10px; fill: #555; text-anchor: start; }
      .box { stroke-width: 1.5; }
      .cyl { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="1030" fill="#ffffff"/>

  <text class="d-title" x="390" y="26">Stage 3 · Object Detection &amp; Model Registry</text>
  <text class="d-sub" x="390" y="44">prepare_dataset.py · DVC · YOLOv8 on Kaggle · MLflow Model Registry</text>

  <!-- input: labelled dataset from Stage 2 -->
  <rect class="box" x="50" y="60" width="680" height="72" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-dasharray="4 3"/>
  <text class="prov" x="390" y="80">FROM STAGE 2</text>
  <text class="name" x="390" y="100">Labelled dataset in MySQL</text>
  <text class="desc" x="390" y="118">annotations, annotation_sets and frames tables</text>

  <!-- prepare_dataset.py -->
  <rect class="box" x="210" y="158" width="360" height="76" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="182">prepare_dataset.py</text>
  <text class="desc" x="390" y="200">picks the annotated frames of the chosen sets,</text>
  <text class="desc" x="390" y="216">splits them 80/20 (fixed seed), writes YOLO files</text>

  <!-- dataset folder -->
  <rect class="box" x="210" y="260" width="360" height="76" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text class="name" x="390" y="284">dataset/&lt;name&gt;/</text>
  <text class="desc" x="390" y="302">images/ and labels/, each with train and val</text>
  <text class="desc" x="390" y="318">dataset.yaml tells YOLO where to find them</text>

  <!-- dataset_card.yaml -->
  <rect class="box" x="604" y="260" width="146" height="76" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text class="name" x="677" y="284">dataset_card.yaml</text>
  <text class="desc" x="677" y="302">annotation sets, videos,</text>
  <text class="desc" x="677" y="318">counts, git commit</text>

  <!-- DVC -->
  <rect class="box" x="210" y="362" width="360" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="386">DVC</text>
  <text class="desc" x="390" y="404">dataset versioned: pointer file in git,</text>
  <text class="desc" x="390" y="418">data on Google Drive</text>

  <!-- Kaggle notebook -->
  <rect class="box" x="210" y="448" width="360" height="76" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="472">Kaggle notebook (GPU)</text>
  <text class="desc" x="390" y="490">clones the repo, pulls the dataset with DVC,</text>
  <text class="desc" x="390" y="506">fine-tunes a pretrained YOLOv8</text>

  <!-- run folder: manual download -->
  <rect class="box" x="210" y="550" width="360" height="76" rx="8" fill="#fce5cd" stroke="#e69138"/>
  <text class="prov-h" x="390" y="568">MANUAL STEP</text>
  <text class="name" x="390" y="587">training run folder</text>
  <text class="desc" x="390" y="605">best.pt, last.pt, results.csv, plots</text>
  <text class="desc" x="390" y="619">downloaded by hand from Kaggle</text>

  <!-- log_artifact_mlflow.py -->
  <rect class="box" x="210" y="652" width="360" height="76" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="390" y="676">log_artifact_mlflow.py</text>
  <text class="desc" x="390" y="694">logs parameters, per-epoch metrics, dataset card,</text>
  <text class="desc" x="390" y="710">registers best.pt as a new model version</text>

  <!-- MLflow Model Registry (cylinder) -->
  <path class="cyl" d="M 190,768 L 190,834 A 200,14 0 0 0 590,834 L 590,768 A 200,14 0 0 0 190,768 Z" fill="#d0e0e3" stroke="#45818e"/>
  <ellipse class="cyl" cx="390" cy="768" rx="200" ry="14" fill="#d0e0e3" stroke="#45818e"/>
  <text class="name" x="390" y="792">MLflow Model Registry (SQLite)</text>
  <text class="desc" x="390" y="810">aquamind-yolo-detector: one new version per retrain</text>
  <text class="desc" x="390" y="826">alias @champion moved to the newest version</text>

  <!-- converged result -->
  <rect class="box" x="190" y="872" width="400" height="86" rx="8" fill="#dbe9f6" stroke="#5b7aa8"/>
  <text class="res" x="390" y="897">Registered fish detector (@champion)</text>
  <text class="desc" x="390" y="917">later stages load it by alias, not by file path</text>
  <text class="note" x="390" y="942">→ Stage 4: tracker · Stage 5: pre-labelling</text>

  <!-- edges -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <polyline points="390,132 390,156" marker-end="url(#arrow2)"/>
    <polyline points="390,234 390,258" marker-end="url(#arrow2)"/>
    <polyline points="570,196 677,196 677,258" marker-end="url(#arrow2)"/>
    <polyline points="390,336 390,360" marker-end="url(#arrow2)"/>
    <polyline points="390,422 390,446" marker-end="url(#arrow2)"/>
    <polyline points="390,524 390,548" marker-end="url(#arrow2)"/>
    <polyline points="390,626 390,650" marker-end="url(#arrow2)"/>
    <polyline points="390,728 390,752" marker-end="url(#arrow2)"/>
    <polyline points="390,848 390,870" marker-end="url(#arrow2)"/>
  </g>

  <!-- provenance: dataset card travels to MLflow -->
  <polyline points="677,336 677,690 572,690" fill="none" stroke="#d6b656" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <text class="tiny" x="677" y="520">provenance</text>

  <!-- downstream marker -->
  <polyline points="390,958 390,990" fill="none" stroke="#5b7aa8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text class="tiny" x="446" y="980">to Stage 4 and 5</text>

  <!-- legend -->
  <g>
    <rect x="30" y="1004" width="11" height="11" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-dasharray="3 2"/>
    <text class="legend" x="47" y="1013">from Stage 2</text>
    <rect x="135" y="1004" width="11" height="11" rx="2" fill="#d5e8d4" stroke="#82b366"/>
    <text class="legend" x="152" y="1013">script / tool step</text>
    <rect x="255" y="1004" width="11" height="11" rx="2" fill="#fce5cd" stroke="#e69138"/>
    <text class="legend" x="272" y="1013">manual step</text>
    <rect x="355" y="1004" width="11" height="11" rx="2" fill="#fff2cc" stroke="#d6b656"/>
    <text class="legend" x="372" y="1013">disk file</text>
    <rect x="445" y="1004" width="11" height="11" rx="2" fill="#d0e0e3" stroke="#45818e"/>
    <text class="legend" x="462" y="1013">registry</text>
    <rect x="535" y="1004" width="11" height="11" rx="2" fill="#dbe9f6" stroke="#5b7aa8"/>
    <text class="legend" x="552" y="1013">result → downstream</text>
  </g>
</svg>
