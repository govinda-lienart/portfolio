<svg width="100%" viewBox="0 0 1320 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Feeding-strike LSTM — forward pass</title>
  <desc>One window's forward pass through the feeding-strike model. 45 per-frame crops (45x3x224x224) pass through a frozen DINOv2 vits14 backbone, producing a (45, 384) embedding sequence. An unrolled LSTM (input_size=384, hidden_size=64) reads the sequence one frame at a time, t=1 through t=45; its hidden state carries forward at each step, but every intermediate hidden state is computed and then discarded — only the final hidden state, h45 (64-dim), is kept. A linear classifier head (nn.Linear, 64 to 2) maps that single vector to two logits, and softmax turns them into a strike / no-strike call, shown as green (no strike) or red (feeding strike).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .title { font-size: 19px; font-weight: 700; fill: #111; }
      .subtitle { font-size: 13px; fill: #666; }
      .colhead { font-size: 13.5px; font-weight: 700; letter-spacing: 0.2px; }
      .lab { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .lab-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #333; }
      .desc { font-size: 11.5px; fill: #4a4a4a; }
      .note-it { font-size: 12.5px; font-style: italic; fill: #8a5a00; }
      .legend { font-size: 10.5px; fill: #444; text-anchor: start; }
      .shapeflow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1a1a1a; }
    </style>
  </defs>

  <!-- opaque background: without this, transparent areas show whatever sits behind the <img>
       (fine on the page's white card, broken in the dark lightbox zoom) -->
  <rect x="0" y="0" width="1320" height="480" fill="#ffffff"/>

  <text class="title" x="660" y="26">Feeding-strike LSTM — forward pass</text>
  <text class="subtitle" x="660" y="44">One window → one prediction: 45 frames of 384-dim DINOv2 embeddings in, a strike / no-strike call out.</text>

  <text class="colhead" x="450" y="66" fill="#4a7a3a">LSTM SEQUENCE ENCODING · nn.LSTM(input_size=384, hidden_size=64)</text>
  <text class="colhead" x="1030" y="66" fill="#8a5a00">CLASSIFIER HEAD · nn.Linear(64, 2)</text>
  <text class="colhead" x="1230" y="66" fill="#555">OUTPUT</text>

  <text class="note-it" x="450" y="90">h₁, h₂, h₃, … each computed, then discarded — only h₄₅ is kept</text>

  <!-- LSTM cells (unrolled) -->
  <rect x="205" y="104" width="70" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text class="lab" x="240" y="137">t=1</text>
  <rect x="315" y="104" width="70" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text class="lab" x="350" y="137">t=2</text>
  <rect x="425" y="104" width="70" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text class="lab" x="460" y="137">t=3</text>
  <text x="570" y="140" font-size="20" fill="#555">⋯</text>
  <rect x="645" y="104" width="70" height="56" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text class="lab" x="680" y="137">t=45</text>

  <!-- recurrence arrows -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <line x1="275" y1="132" x2="313" y2="132" marker-end="url(#arrow)"/>
    <line x1="385" y1="132" x2="423" y2="132" marker-end="url(#arrow)"/>
    <line x1="495" y1="132" x2="550" y2="132" marker-end="url(#arrow)"/>
    <line x1="592" y1="132" x2="643" y2="132" marker-end="url(#arrow)"/>
  </g>
  <text class="lab-sm" x="294" y="120">h₁</text>
  <text class="lab-sm" x="618" y="120">h₄₄</text>

  <!-- input embedding row -->
  <rect x="205" y="195" width="70" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text class="lab" x="240" y="220">x₁</text>
  <rect x="315" y="195" width="70" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text class="lab" x="350" y="220">x₂</text>
  <rect x="425" y="195" width="70" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text class="lab" x="460" y="220">x₃</text>
  <text x="570" y="220" font-size="18" fill="#555">⋯</text>
  <rect x="645" y="195" width="70" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text class="lab" x="680" y="220">x₄₅</text>

  <!-- vertical feed arrows -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <line x1="240" y1="195" x2="240" y2="162" marker-end="url(#arrow)"/>
    <line x1="350" y1="195" x2="350" y2="162" marker-end="url(#arrow)"/>
    <line x1="460" y1="195" x2="460" y2="162" marker-end="url(#arrow)"/>
    <line x1="680" y1="195" x2="680" y2="162" marker-end="url(#arrow)"/>
  </g>

  <!-- DINOv2 frozen backbone bar, feeding the whole input row -->
  <rect x="205" y="250" width="510" height="34" rx="6" fill="#c8dcf0" stroke="#5b84b1" stroke-width="1.5"/>
  <text class="lab" x="460" y="271">DINOv2 vits14 (❄ frozen backbone)</text>

  <text class="desc" x="460" y="300">window embedding sequence — (45, 384), one 384-dim vector per frame (cached)</text>

  <!-- crop thumbnails (abstract placeholders, not photos) -->
  <g>
    <rect x="205" y="314" width="44" height="34" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
    <path d="M209 318 L245 318 M209 344 L245 344" stroke="#bbb" stroke-width="0.8"/>
    <text class="desc" x="227" y="335" font-size="9">crop 1</text>
    <rect x="257" y="314" width="44" height="34" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
    <path d="M261 318 L297 318 M261 344 L297 344" stroke="#bbb" stroke-width="0.8"/>
    <text class="desc" x="279" y="335" font-size="9">crop 2</text>
    <rect x="309" y="314" width="44" height="34" rx="3" fill="#eee" stroke="#999" stroke-width="1"/>
    <path d="M313 318 L349 318 M313 344 L349 344" stroke="#bbb" stroke-width="0.8"/>
    <text class="desc" x="331" y="335" font-size="9">crop 3</text>
    <text x="375" y="336" font-size="16" fill="#555">⋯</text>
  </g>

  <text class="shapeflow" x="700" y="388">45 crops → DINOv2 (frozen) → (B, 45, 384) → LSTM → (B, 64) → Linear → (B, 2) → softmax → (B, 2) probabilities</text>
  <text class="desc" x="700" y="406">45 per-frame crops (45 × 3 × 224 × 224)</text>

  <!-- final hidden state box -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <line x1="715" y1="132" x2="758" y2="132" marker-end="url(#arrow)"/>
  </g>
  <rect x="760" y="94" width="115" height="76" rx="8" fill="#fff3e0" stroke="#d79b00" stroke-width="2.5"/>
  <text class="lab" x="817" y="124">h₄₅</text>
  <text class="lab-sm" x="817" y="142">(64-dim)</text>
  <text class="desc" x="817" y="158">final hidden state</text>

  <!-- classifier head enclosure -->
  <rect x="905" y="58" width="255" height="168" rx="10" fill="#fffaf2" stroke="#d79b00" stroke-width="1" stroke-dasharray="5 4"/>
  <g fill="none" stroke="#555" stroke-width="1.5">
    <line x1="875" y1="132" x2="920" y2="132" marker-end="url(#arrow)"/>
  </g>

  <!-- left "64-dim vector" nodes -->
  <circle cx="945" cy="77" r="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <circle cx="945" cy="105" r="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <text x="945" y="138" font-size="16" fill="#8a5a00">⋮</text>
  <circle cx="945" cy="159" r="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <circle cx="945" cy="187" r="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <text class="desc" x="945" y="210">64 values</text>

  <!-- right "2 logits" nodes -->
  <circle cx="1125" cy="110" r="9" fill="#fff" stroke="#d79b00" stroke-width="1.8"/>
  <circle cx="1125" cy="154" r="9" fill="#fff" stroke="#d79b00" stroke-width="1.8"/>
  <text class="desc" x="1125" y="178">2 logits</text>

  <!-- fully-connected fan -->
  <g stroke="#d79b00" stroke-width="0.8" opacity="0.55">
    <line x1="952" y1="77" x2="1116" y2="110"/>
    <line x1="952" y1="77" x2="1116" y2="154"/>
    <line x1="952" y1="105" x2="1116" y2="110"/>
    <line x1="952" y1="105" x2="1116" y2="154"/>
    <line x1="952" y1="159" x2="1116" y2="110"/>
    <line x1="952" y1="159" x2="1116" y2="154"/>
    <line x1="952" y1="187" x2="1116" y2="110"/>
    <line x1="952" y1="187" x2="1116" y2="154"/>
  </g>

  <!-- softmax + output -->
  <text class="lab-sm" x="1180" y="90">softmax</text>
  <g fill="none" stroke="#555" stroke-width="1.5">
    <line x1="1134" y1="110" x2="1198" y2="76" marker-end="url(#arrow)"/>
    <line x1="1134" y1="154" x2="1198" y2="192" marker-end="url(#arrow)"/>
  </g>

  <rect x="1200" y="46" width="115" height="52" rx="26" fill="#e6f4ea" stroke="#4c8c5b" stroke-width="1.8"/>
  <text class="lab-sm" x="1257" y="68" fill="#2f5d3a">class 0</text>
  <text class="lab-sm" x="1257" y="84" fill="#2f5d3a">no strike</text>

  <rect x="1200" y="166" width="115" height="52" rx="26" fill="#fbe4e2" stroke="#b3423d" stroke-width="1.8"/>
  <text class="lab-sm" x="1257" y="188" fill="#7a2a26">class 1</text>
  <text class="lab-sm" x="1257" y="204">feeding strike</text>

  <!-- legend -->
  <g>
    <rect x="40" y="445" width="10" height="10" rx="2" fill="#eee" stroke="#999"/>
    <text class="legend" x="55" y="453">crop image</text>
    <rect x="150" y="445" width="10" height="10" rx="2" fill="#c8dcf0" stroke="#5b84b1"/>
    <text class="legend" x="165" y="453">DINOv2 (❄ frozen)</text>
    <rect x="300" y="445" width="10" height="10" rx="2" fill="#dae8fc" stroke="#6c8ebf"/>
    <text class="legend" x="315" y="453">per-frame embedding (cached)</text>
    <rect x="500" y="445" width="10" height="10" rx="2" fill="#d5e8d4" stroke="#82b366"/>
    <text class="legend" x="515" y="453">LSTM cell (recurrent)</text>
    <rect x="660" y="445" width="10" height="10" rx="2" fill="#ffe6cc" stroke="#d79b00"/>
    <text class="legend" x="675" y="453">trainable / kept state</text>
    <rect x="830" y="445" width="10" height="10" rx="2" fill="#e6f4ea" stroke="#4c8c5b"/>
    <text class="legend" x="845" y="453">predicted: no strike</text>
    <rect x="1010" y="445" width="10" height="10" rx="2" fill="#fbe4e2" stroke="#b3423d"/>
    <text class="legend" x="1025" y="453">predicted: feeding strike</text>
  </g>
</svg>
