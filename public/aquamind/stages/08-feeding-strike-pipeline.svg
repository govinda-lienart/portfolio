<svg width="100%" viewBox="0 0 760 862" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Stage 8 — feeding-strike classifier pipeline</title>
  <desc>Two data inputs (tracks.parquet with crops, and feeding_labels.xlsx) feed a four-step whole-event pipeline: build windows, build crops, build DINOv2 embeddings, then train an LSTM. The kept model reaches 70% accuracy, 0.71 precision, 0.71 recall. A deferred downstream phase (overlay, counters, report) and a separate geometry-only baseline branch are shown as side paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .d-title { font-size: 15px; font-weight: 700; fill: #111; }
      .d-sub { font-size: 11px; fill: #666; }
      .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .name-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #333; }
      .desc { font-size: 11px; fill: #4a4a4a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .kept { font-size: 12px; font-weight: 700; fill: #8a5a00; }
      .mut { font-size: 11px; fill: #6a6a6a; }
      .mut2 { font-size: 10.5px; fill: #8a8a8a; }
      .bl-head { font-size: 12.5px; font-weight: 700; fill: #7a3b38; }
      .branch-label { font-size: 10px; fill: #9a9a9a; text-anchor: start; }
      .legend { font-size: 10px; fill: #555; text-anchor: start; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>

  <text class="d-title" x="380" y="26">Stage 8 — Feeding-Strike Classifier (CNN + LSTM)</text>
  <text class="d-sub" x="380" y="44">video IMG_2349.MOV · food-injection segment · 119 labelled strikes</text>

  <!-- inputs -->
  <rect class="box" x="40" y="64" width="330" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="name" x="205" y="98">tracks.parquet  +  crops</text>
  <text class="desc" x="205" y="118">tracker run (reused from Stage 4–6):</text>
  <text class="name-sm" x="205" y="135">tracker_IMG_2349_appearance_2026_08_12_1926/</text>

  <rect class="box" x="390" y="64" width="330" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="name" x="555" y="90">feeding_labels.xlsx</text>
  <text class="desc" x="555" y="108">119 labelled strikes (Phase A)</text>
  <text class="desc" x="555" y="125">pos = real-food sub-section</text>
  <text class="desc" x="555" y="142">neg = injected-water sub-section</text>

  <!-- main pipeline -->
  <rect class="box" x="200" y="200" width="360" height="56" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="380" y="222">build_feeding_windows_whole_event.py</text>
  <text class="desc" x="380" y="240">real event spans + length-matched negatives</text>

  <rect class="box" x="200" y="290" width="360" height="56" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="380" y="312">build_feeding_crops_whole_event.py</text>
  <text class="desc" x="380" y="330">per-fish crop sequence per window</text>

  <rect class="box" x="200" y="380" width="360" height="56" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text class="name" x="380" y="402">build_feeding_embeddings_whole_event.py</text>
  <text class="desc" x="380" y="420">DINOv2 vits14 (frozen) → per-frame embedding</text>

  <rect class="box" x="160" y="470" width="440" height="104" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="head" x="380" y="494" style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;">train_feeding_lstm_whole_event.py</text>
  <text class="desc" x="380" y="514">LSTM over the embedding sequence</text>
  <text class="desc" x="380" y="531">early stopping → epoch-22 (min test-loss) checkpoint</text>
  <text class="kept" x="380" y="553">KEPT MODEL — 70% acc · 0.71 precision · 0.71 recall</text>

  <!-- deferred downstream -->
  <rect class="box" x="180" y="612" width="400" height="54" rx="8" fill="#f4f4f4" stroke="#b0b0b0" stroke-dasharray="5 4"/>
  <text class="mut" x="380" y="634" style="font-weight:700;">Phase F — downstream · deferred (paused 2026-08-26)</text>
  <text class="mut2" x="380" y="652">overlay · per-fish strike counters · automated report</text>

  <!-- baseline branch -->
  <rect class="box" x="90" y="712" width="580" height="96" rx="8" fill="#f8cecc" stroke="#b85450"/>
  <text class="bl-head" x="380" y="737">Phase B — geometry-only baseline (comparison point)</text>
  <text class="name-sm" x="380" y="758">build_feeding_windows_fixed_window.py → train_feeding_classifier.py</text>
  <text class="desc" x="380" y="778">≈ 61% accuracy (near chance) → evidence that CNN appearance features were needed</text>

  <!-- edges -->
  <g fill="none" stroke="#555" stroke-width="1.5">
    <polyline points="205,160 205,183 380,183 380,198" marker-end="url(#arrow)"/>
    <polyline points="555,160 555,183 380,183 380,198" marker-end="url(#arrow)"/>
    <polyline points="380,256 380,288" marker-end="url(#arrow)"/>
    <polyline points="380,346 380,378" marker-end="url(#arrow)"/>
    <polyline points="380,436 380,468" marker-end="url(#arrow)"/>
    <polyline points="380,574 380,610" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <polyline points="120,160 120,760 88,760" stroke="#999" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
  <text class="branch-label" x="126" y="392">geometry-only</text>
  <text class="branch-label" x="126" y="405">comparison</text>

  <!-- legend -->
  <g>
    <rect x="60" y="828" width="11" height="11" rx="2" fill="#dae8fc" stroke="#6c8ebf"/>
    <text class="legend" x="77" y="837">data artifact</text>
    <rect x="170" y="828" width="11" height="11" rx="2" fill="#d5e8d4" stroke="#82b366"/>
    <text class="legend" x="187" y="837">script step</text>
    <rect x="272" y="828" width="11" height="11" rx="2" fill="#ffe6cc" stroke="#d79b00"/>
    <text class="legend" x="289" y="837">trained model</text>
    <rect x="390" y="828" width="11" height="11" rx="2" fill="#f4f4f4" stroke="#b0b0b0" stroke-dasharray="3 2"/>
    <text class="legend" x="407" y="837">deferred</text>
    <rect x="486" y="828" width="11" height="11" rx="2" fill="#f8cecc" stroke="#b85450"/>
    <text class="legend" x="503" y="837">comparison baseline</text>
  </g>
</svg>
