<svg width="100%" viewBox="0 0 680 384" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>YOLO bounding-box coordinates for one fish</title>
  <desc>A tank image with one fish and its bounding box. The label line "0 0.242 0.668 0.103 0.113" is broken down into class 0 (danio_rerio), x centre 0.242 (24 percent from the left edge), y centre 0.668 (67 percent from the top edge), width 0.103 (10 percent of the image width) and height 0.113 (11 percent of the image height). All values are normalised between 0 and 1, so the format works for any image size.</desc>
  <defs>
    <marker id="yarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ax { font-size: 11px; fill: #666; }
      .lab { font-size: 11.5px; }
      .head { font-size: 13px; font-weight: 700; fill: #111; }
      .row { font-size: 12px; fill: #1a1a1a; }
      .sub { font-size: 11px; fill: #666; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #f5f5f5; }
      .note { font-size: 11px; fill: #444; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="384" fill="#ffffff"/>

  <!-- axes -->
  <text class="ax" x="40" y="12">x=0</text>
  <text class="ax" x="420" y="12" text-anchor="end">x=1</text>
  <line x1="66" y1="8" x2="128" y2="8" stroke="#999" stroke-width="0.8"/>
  <text class="ax" x="230" y="12" text-anchor="middle">image frame (normalised 0 to 1)</text>
  <line x1="332" y1="8" x2="386" y2="8" stroke="#999" stroke-width="0.8" marker-end="url(#yarrow)"/>
  <text class="ax" x="2" y="44">y=0</text>
  <text class="ax" x="2" y="334">y=1</text>
  <line x1="28" y1="50" x2="28" y2="330" stroke="#999" stroke-width="0.8" marker-end="url(#yarrow)"/>

  <!-- image frame: simulated tank -->
  <rect x="40" y="30" width="380" height="300" rx="4" fill="#1a3a2a" stroke="#bbb" stroke-width="1"/>
  <rect x="40" y="30" width="380" height="300" rx="4" fill="#0d2b1e" opacity="0.8"/>
  <rect x="40" y="30" width="380" height="100" rx="4" fill="#0a4a35" opacity="0.5"/>
  <rect x="40" y="290" width="380" height="40" fill="#2a1f0e" opacity="0.7"/>

  <!-- fish -->
  <ellipse cx="132" cy="230" rx="14" ry="8" fill="#f0a000" opacity="0.95"/>
  <polygon points="118,226 110,220 110,240" fill="#e08000" opacity="0.95"/>
  <circle cx="138" cy="228" r="2" fill="#222"/>

  <!-- bounding box and centre -->
  <rect x="112" y="213" width="39" height="34" rx="2" fill="none" stroke="#00e676" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="132" cy="230" r="3" fill="#00e676"/>

  <!-- x_center: from the left edge to the centre -->
  <line x1="40" y1="230" x2="132" y2="230" stroke="#4fc3f7" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text class="lab" x="46" y="224" fill="#4fc3f7">x_center</text>

  <!-- y_center: from the top edge to the centre -->
  <line x1="132" y1="30" x2="132" y2="230" stroke="#ef9a9a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text class="lab" x="138" y="140" fill="#ef9a9a">y_center</text>

  <!-- width and height of the box -->
  <line x1="112" y1="258" x2="151" y2="258" stroke="#00e676" stroke-width="1" marker-start="url(#yarrow)" marker-end="url(#yarrow)"/>
  <text class="lab" x="131" y="273" text-anchor="middle" fill="#00e676">w</text>
  <line x1="162" y1="213" x2="162" y2="247" stroke="#00e676" stroke-width="1" marker-start="url(#yarrow)" marker-end="url(#yarrow)"/>
  <text class="lab" x="167" y="234" fill="#00e676">h</text>

  <!-- divider -->
  <line x1="450" y1="30" x2="450" y2="330" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- breakdown of the label line -->
  <text class="head" x="470" y="48">YOLO line breakdown</text>
  <rect x="470" y="58" width="206" height="26" rx="4" fill="#1e1e1e"/>
  <text class="mono" x="478" y="75">0 0.242 0.668 0.103 0.113</text>

  <rect x="470" y="102" width="10" height="10" rx="2" fill="#999"/>
  <text class="row" x="488" y="111">class_id = 0 (danio_rerio)</text>

  <rect x="470" y="128" width="10" height="10" rx="2" fill="#4fc3f7"/>
  <text class="row" x="488" y="137">x_center = 0.242</text>
  <text class="sub" x="488" y="151">24% from the left edge</text>

  <rect x="470" y="166" width="10" height="10" rx="2" fill="#ef9a9a"/>
  <text class="row" x="488" y="175">y_center = 0.668</text>
  <text class="sub" x="488" y="189">67% from the top edge</text>

  <rect x="470" y="204" width="10" height="10" rx="2" fill="#00e676"/>
  <text class="row" x="488" y="213">width = 0.103</text>
  <text class="sub" x="488" y="227">10% of the image width</text>

  <rect x="470" y="242" width="10" height="10" rx="2" fill="#00e676" opacity="0.6"/>
  <text class="row" x="488" y="251">height = 0.113</text>
  <text class="sub" x="488" y="265">11% of the image height</text>

  <!-- key point -->
  <rect x="470" y="278" width="206" height="56" rx="6" fill="#f3f3f1" stroke="#ccc" stroke-width="0.8"/>
  <text class="note" x="480" y="296">All values are normalised</text>
  <text class="note" x="480" y="311">between 0 and 1, so the format</text>
  <text class="note" x="480" y="326">works for any image size</text>

  <text class="note" x="230" y="362" text-anchor="middle">One fish = one line in the .txt file. Six fish = six lines.</text>
</svg>
